name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 8
      uses: actions/setup-java@v4
      with:
        # 注意：老项目（SDK 26）用 JDK 8 最稳妥，用 11 可能会报错
        java-version: '8' 
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      # 改成 assembleDebug，只生成 Debug APK，避免跑测试报错
      run: ./gradlew assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: 长歌CHM-APK
        path: app/build/outputs/apk/debug/*.apk
